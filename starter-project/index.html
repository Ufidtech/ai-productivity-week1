<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tracker — Starter Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Study Tracker</h1>
      <p class="subtitle">A tiny starter project. Extend it with Copilot's help tonight.</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a task…" required />
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>

    <p class="stats" id="stats">0 tasks · 0 done</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
